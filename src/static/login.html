<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Barber | Autenticação</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-[#0B0B0C] text-[#F9FAFB] font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#141416] border border-[#27272A] rounded-3xl p-8 shadow-2xl relative overflow-hidden">
        
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-[#D4AF37]/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="text-center space-y-3 mb-8">
            <div class="w-14 h-14 rounded-2xl bg-[#D4AF37] flex items-center justify-center text-[#0B0B0C] font-bold text-2xl mx-auto shadow-lg shadow-[#D4AF37]/20">
                <i class="fa-solid fa-scissors"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl tracking-wider text-white">SOVEREIGN</h1>
                <p class="text-xs text-[#D4AF37] uppercase tracking-widest mt-1">Barber Studio Management</p>
            </div>
        </div>

        <form class="space-y-5" onsubmit="return false;">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">E-mail Profissional</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" id="login-email" value="admin@sovereign.com" required 
                        class="w-full bg-[#0B0B0C] border border-[#27272A] rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-[#D4AF37] transition">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs font-semibold text-gray-400 uppercase">Palavra-passe</label>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500">
                        <i class="fa-regular fa-lock"></i>
                    </span>
                    <input type="password" id="login-password" value="SovereignSecure2026!" required 
                        class="w-full bg-[#0B0B0C] border border-[#27272A] rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-[#D4AF37] transition">
                </div>
            </div>

            <button type="button" onclick="realizarLoginDireto()" class="w-full bg-[#D4AF37] text-[#0B0B0C] font-bold py-3 rounded-xl hover:bg-[#e5c558] transition shadow-lg shadow-[#D4AF37]/10 mt-2">
                Aceder ao Sistema
            </button>
        </form>

        <div class="mt-8 text-center border-t border-[#27272A] pt-4">
            <p class="text-xs text-gray-500">Acesso restrito a administradores autorizados.</p>
        </div>
    </div>

    <script>
        async function realizarLoginDireto() {
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await response.json();

                if (response.ok && data.access_token) {
                    localStorage.setItem('token', data.access_token);
                    window.location.href = '/static/index.html';
                } else {
                    alert(data.detail || 'E-mail ou palavra-passe incorretos.');
                }
            } catch (err) {
                console.error("Erro de ligação:", err);
                alert('Erro ao comunicar com o servidor.');
            }
        }
    </script>
</body>
</html>
