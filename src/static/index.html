<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Barber | Painel Administrativo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos Customizados -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-[#0B0B0C] text-[#F9FAFB] font-sans antialiased min-h-screen flex">

    <!-- Sidebar Lateral -->
    <aside class="w-64 bg-[#141416] border-r border-[#27272A] flex flex-col justify-between hidden md:flex">
        <div class="p-6">
            <div class="flex items-center space-x-3 mb-8">
                <div class="w-10 h-10 rounded-xl bg-[#D4AF37] flex items-center justify-center text-[#0B0B0C] font-bold text-lg shadow-md shadow-[#D4AF37]/20">
                    <i class="fa-solid fa-scissors"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm tracking-wider text-white">SOVEREIGN</h1>
                    <p class="text-[10px] text-[#D4AF37] uppercase tracking-widest">Barber Studio</p>
                </div>
            </div>

            <nav class="space-y-1">
                <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium bg-[#27272A]/50 text-[#D4AF37] border border-[#D4AF37]/20">
                    <i class="fa-solid fa-chart-pie w-5"></i>
                    <span>Dashboard</span>
                </a>
            </nav>
        </div>

        <div class="p-6 border-t border-[#27272A]">
            <button onclick="localStorage.removeItem('token'); window.location.href='/static/login.html';" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium text-red-400 hover:bg-red-500/10 transition">
                <i class="fa-solid fa-arrow-right-from-bracket w-5"></i>
                <span>Terminar Sessão</span>
            </button>
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        <!-- Topbar -->
        <header class="h-16 bg-[#141416] border-b border-[#27272A] flex items-center justify-between px-6 sticky top-0 z-10">
            <h2 class="font-bold text-lg text-white">Painel Geral</h2>
            <div class="flex items-center space-x-3">
                <span class="text-xs bg-[#D4AF37]/10 text-[#D4AF37] px-3 py-1 rounded-full font-semibold border border-[#D4AF37]/20">Admin Ativo</span>
            </div>
        </header>

        <!-- Dashboard Content -->
        <div class="p-6 space-y-6">
            
            <!-- Cards de Estatísticas -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-[#141416] p-5 rounded-2xl border border-[#27272A]">
                    <p class="text-xs text-gray-400 uppercase font-semibold mb-1">Agendamentos Hoje</p>
                    <h3 id="stat-agendamentos" class="text-2xl font-bold text-white">0</h3>
                </div>
                <div class="bg-[#141416] p-5 rounded-2xl border border-[#27272A]">
                    <p class="text-xs text-gray-400 uppercase font-semibold mb-1">Clientes Ativos</p>
                    <h3 id="stat-clientes" class="text-2xl font-bold text-white">0</h3>
                </div>
                <div class="bg-[#141416] p-5 rounded-2xl border border-[#27272A]">
                    <p class="text-xs text-gray-400 uppercase font-semibold mb-1">Faturamento Mensal</p>
                    <h3 id="stat-faturamento" class="text-2xl font-bold text-[#D4AF37]">R$ 0,00</h3>
                </div>
                <div class="bg-[#141416] p-5 rounded-2xl border border-[#27272A]">
                    <p class="text-xs text-gray-400 uppercase font-semibold mb-1">Serviços Realizados</p>
                    <h3 id="stat-servicos" class="text-2xl font-bold text-white">0</h3>
                </div>
            </div>

            <!-- Listagem de Clientes e Botão de Ação -->
            <div class="bg-[#141416] p-6 rounded-2xl border border-[#27272A]">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-white text-base">Clientes Registados Recentemente</h3>
                    <button onclick="abrirModalCliente()" class="bg-[#D4AF37] hover:bg-[#b8972e] text-[#0B0B0C] font-bold px-4 py-2 rounded-xl text-sm transition flex items-center space-x-2 shadow-lg shadow-[#D4AF37]/10 cursor-pointer">
                        <i class="fa-solid fa-plus"></i>
                        <span>Novo Cliente</span>
                    </button>
                </div>
                
                <div id="grid-clientes" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <p class="text-sm text-gray-500 col-span-2">A carregar dados...</p>
                </div>
            </div>

        </div>
    </main>

    <!-- MODAL NOVO CLIENTE -->
    <div id="modal-cliente" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-[#141416] border border-[#27272A] w-full max-w-md p-6 rounded-2xl shadow-2xl relative">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-white text-lg">Registar Novo Cliente</h3>
                <button onclick="fecharModalCliente()" class="text-gray-400 hover:text-white text-lg cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="form-novo-cliente" onsubmit="registarCliente(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Nome Completo (Mín. 3 carateres)</label>
                    <input type="text" id="cliente-nome" required class="w-full bg-[#0B0B0C] border border-[#27272A] rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-[#D4AF37]">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Telemóvel</label>
                    <input type="text" id="cliente-telefone" placeholder="(00) 00000-0000" required class="w-full bg-[#0B0B0C] border border-[#27272A] rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-[#D4AF37]">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">E-mail</label>
                    <input type="email" id="cliente-email" placeholder="exemplo@email.com" required class="w-full bg-[#0B0B0C] border border-[#27272A] rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-[#D4AF37]">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">CPF (11 dígitos)</label>
                    <input type="text" id="cliente-cpf" placeholder="000.000.000-00" required class="w-full bg-[#0B0B0C] border border-[#27272A] rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-[#D4AF37]">
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="fecharModalCliente()" class="px-4 py-2 bg-transparent text-gray-400 hover:text-white text-sm font-medium transition cursor-pointer">Cancelar</button>
                    <button type="submit" class="bg-[#D4AF37] hover:bg-[#b8972e] text-[#0B0B0C] font-bold px-5 py-2 rounded-xl text-sm transition cursor-pointer">Guardar Cliente</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Gestão do Painel -->
    <script src="/static/script.js"></script>
</body>
</html>
